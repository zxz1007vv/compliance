# User-editable launcher configuration. Relative paths start from this file.
schema_version: 1
task_name: zgwsarm_compliance

paths:
  repository_root: ../..
  deployment_bundle: ../policies/zgwsarm
  scene_path: ../models/zgwsarm/scene_terrain.xml
  policy_backend: torchscript
  # An absolute exported policy path, such as .../policy_001200.pt, is also valid.
  policy_path: /home/user/PROJECT/compliance/logs/zgwsarm_compliance/2026-08-24_18-44-10_wbc_release/exported/policies/policy_latest.pt

runtime:
  viewer: true
  realtime: true
  # 0 runs until the Viewer is closed or Ctrl+C is pressed.
  steps: 0
  # 0 disables terminal status output.
  status_interval_seconds: 1.0

teleoperation:
  deadzone: 0.10
  force_limit: 30.0
  # In force mode, latch the current EE world point and create the same
  # virtual spring-damper force field used during training.
  force_field_enabled: true
  force_field_stiffness: 200.0  # N/m
  force_field_damping: 6.0      # N*s/m
  force_field_limit: 30.0       # per-axis clamp, N
  position_rates: [0.20, 0.75, 0.75]
  wrist_rate: 0.75
  gripper_rate: 0.75

# A executes current pose -> fold pose -> stand pose with dog-only PD.
# The arm holds its deployment default with PD until B gives control to policy.
startup:
  fold_duration_seconds: 0.5
  stand_duration_seconds: 0.5

  # FAR, FBL, RAR, RBL; each group is ABAD, HIP, KNEE, FOOT(wheel).
  dog_joint_names:
    [FAR_ABAD_JOINT, FAR_HIP_JOINT, FAR_KNEE_JOINT, FAR_FOOT_JOINT,
     FBL_ABAD_JOINT, FBL_HIP_JOINT, FBL_KNEE_JOINT, FBL_FOOT_JOINT,
     RAR_ABAD_JOINT, RAR_HIP_JOINT, RAR_KNEE_JOINT, RAR_FOOT_JOINT,
     RBL_ABAD_JOINT, RBL_HIP_JOINT, RBL_KNEE_JOINT, RBL_FOOT_JOINT]
  fold_positions:
    [0.0, 1.4, -2.4, 0.0,
     0.0, 1.4, -2.4, 0.0,
     0.0, -1.4, 2.4, 0.0,
     0.0, -1.4, 2.4, 0.0]
  stand_positions:
    [0.0, 0.6, -1.2, 0.0,
     0.0, 0.6, -1.2, 0.0,
     0.0, -0.6, 1.2, 0.0,
     0.0, -0.6, 1.2, 0.0]
  kp:
    [200.0, 200.0, 200.0, 200.0,
     200.0, 200.0, 200.0, 200.0,
     200.0, 200.0, 200.0, 200.0,
     200.0, 200.0, 200.0, 200.0]
  kd:
    [5.0, 5.0, 5.0, 5.0,
     5.0, 5.0, 5.0, 5.0,
     5.0, 5.0, 5.0, 5.0,
     5.0, 5.0, 5.0, 5.0]
